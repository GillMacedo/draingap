apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: registry.example.com/orders:1.4.0
          args: ["-addr=:8080", "-shutdown-timeout=30s"]
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
---
